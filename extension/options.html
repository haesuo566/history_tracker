<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>방문기록 트래커 설정</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--surface-alt); padding: 32px 20px 56px; }

    .page { max-width: 560px; margin: 0 auto; }

    .page-head { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .page-head .brand-mark { width: 34px; height: 34px; border-radius: 11px; }
    .page-head .brand-mark svg { width: 19px; height: 19px; }
    .page-head h1 { font-size: 19px; font-weight: 660; letter-spacing: -0.02em; margin: 0; }
    .page-head p { margin: 1px 0 0; font-size: 12.5px; color: var(--text-dim); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 620;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin: 0 0 14px;
    }

    .field + .field { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }

    .field-label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
    .field-hint { margin: 0 0 9px; font-size: 12.5px; color: var(--text-dim); }

    input[type='url'],
    input[type='number'],
    select {
      font: inherit;
      font-size: 13.5px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 9px 11px;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input[type='url'] { width: 100%; }
    input[type='url'].is-invalid { border-color: var(--danger); }

    .input-group { display: flex; gap: 8px; }
    .input-group input { width: 130px; text-align: right; font-variant-numeric: tabular-nums; }
    .input-group select { min-width: 76px; cursor: pointer; }

    .field-note { margin: 9px 0 0; font-size: 12.5px; color: var(--text-dim); }
    .field-note strong { color: var(--text); font-weight: 620; }
    .field-error { margin: 7px 0 0; font-size: 12.5px; color: var(--danger); min-height: 1em; }

    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text-dim);
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }
    .chip:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .chip[aria-pressed='true'] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .actions { display: flex; align-items: center; gap: 12px; }

    .toast {
      font-size: 12.5px;
      color: var(--on);
      font-weight: 550;
      opacity: 0;
      transform: translateY(2px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .toast.is-visible { opacity: 1; transform: none; }
    .toast.is-error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-head">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7.5V12l3 2" />
        </svg>
      </span>
      <div>
        <h1>방문기록 트래커</h1>
        <p>수집 대상과 전송 서버를 설정합니다.</p>
      </div>
    </header>

    <section class="card">
      <h2 class="card-title">수집</h2>
      <div class="status-card" id="statusCard">
        <span class="status-dot" aria-hidden="true"></span>
        <div class="status-text">
          <div class="status-title" id="trackingLabel">수집 중</div>
          <div class="status-sub" id="trackingSub">방문이 끝나면 서버로 전송합니다</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="trackingToggle" aria-label="수집 켜기/끄기" />
          <span class="track" aria-hidden="true"><span class="thumb"></span></span>
        </label>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">설정</h2>

      <div class="field">
        <label class="field-label" for="endpoint">API 서버 주소</label>
        <p class="field-hint">
          실제 요청은 이 주소 뒤에 <code>/collect</code>를 붙여서 전송됩니다.
        </p>
        <input type="url" id="endpoint" placeholder="https://your-api.example.com"
               spellcheck="false" autocomplete="off" />
        <p class="field-error" id="endpointError"></p>
      </div>

      <div class="field">
        <label class="field-label" for="dwellValue">최소 체류시간</label>
        <p class="field-hint">
          이 시간 이상 머문 방문만 수집됩니다. 0이면 필터 없이 전부 수집합니다.
        </p>
        <div class="input-group">
          <input type="number" id="dwellValue" min="0" step="1" placeholder="0" />
          <select id="dwellUnit" aria-label="시간 단위">
            <option value="sec">초</option>
            <option value="min">분</option>
          </select>
        </div>
        <div class="presets" id="presets">
          <button type="button" class="chip" data-seconds="0">없음</button>
          <button type="button" class="chip" data-seconds="5">5초</button>
          <button type="button" class="chip" data-seconds="15">15초</button>
          <button type="button" class="chip" data-seconds="30">30초</button>
          <button type="button" class="chip" data-seconds="60">1분</button>
          <button type="button" class="chip" data-seconds="300">5분</button>
        </div>
        <p class="field-note">적용 기준: <strong id="dwellPreview">-</strong></p>
        <p class="field-note">0.5초 미만 체류는 탭 전환 튐으로 보고 항상 제외됩니다.</p>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn" id="save">저장</button>
      <span class="toast" id="status" role="status"></span>
    </div>

    <section class="card" style="margin-top: 22px">
      <h2 class="card-title">기기</h2>
      <dl class="info-list">
        <div class="info-row">
          <dt>기기 ID</dt>
          <dd class="mono" id="deviceId">-</dd>
        </div>
        <div class="info-row">
          <dt>확장 버전</dt>
          <dd id="version">-</dd>
        </div>
      </dl>
    </section>
  </div>

  <script src="dwell.js"></script>
  <script src="options.js"></script>
</body>
</html>
