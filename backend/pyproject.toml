[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "오해수", email = "haesuo566@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.15.0",
    # TEI(OpenAI 호환 /v1/embeddings) 호출용. 테스트 클라이언트만 쓰던 dev 의존성에서 옮겨왔다.
    "httpx>=0.28.1",
    "kiwipiepy>=0.23.2",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "sqlite-vec>=0.1.6",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
